<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(960 40) rotate(125) scale(620 460)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cf6b1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7cf6b1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 520) rotate(-40) scale(460 340)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fc0ff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#9fc0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9ffe3"/>
      <stop offset=".55" stop-color="#7cf6b1"/>
      <stop offset="1" stop-color="#9fc0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9fff0"/>
      <stop offset=".5" stop-color="#7cf6b1"/>
      <stop offset="1" stop-color="#a8c4ff"/>
    </linearGradient>
    <radialGradient id="maskFade" cx="0" cy="0" r="1" gradientTransform="translate(600 180) rotate(90) scale(520 700)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1200" height="630" fill="url(#maskFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".55" mask="url(#fadeMask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- brand -->
  <g transform="translate(80 72)">
    <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#mark)"/>
    <path d="M20 42c3.4 2.6 7.4 4 11.8 4 5.6 0 9.2-2.6 9.2-6.2 0-3.6-3.2-5.2-9.4-6.6-7-1.6-10.4-4-10.4-8.8 0-5 4.6-8.4 11-8.4 3.8 0 7.2 1 9.8 2.8" fill="none" stroke="#04160c" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="45.8" cy="19.5" r="4.2" fill="#04160c"/>
    <text x="86" y="29" fill="#f2f6fb" font-size="28" font-weight="600" letter-spacing=".02em">SuperAgent</text>
    <text x="86" y="53" fill="#96a3b5" font-size="15" font-family="Consolas, monospace" letter-spacing=".2em">AUTONOMOUS CODING AGENT</text>
  </g>

  <!-- headline -->
  <text x="78" y="322" font-size="76" font-weight="600" fill="#f2f6fb" letter-spacing="-.02em">把一句话，</text>
  <text x="78" y="418" font-size="76" font-weight="600" fill="url(#accent)" letter-spacing="-.02em">变成一次交付。</text>

  <!-- rule -->
  <rect x="80" y="484" width="88" height="2" fill="#7cf6b1"/>

  <text x="80" y="534" fill="#96a3b5" font-size="24">在真实代码库中理解需求、动手实现、跑通检查，</text>
  <text x="80" y="572" fill="#96a3b5" font-size="24">最后把一份可评审的 Pull Request 交到你手上。</text>

  <text x="1120" y="566" text-anchor="end" fill="#6b788b" font-size="16" font-family="Consolas, monospace" letter-spacing=".08em">github.com/miracleguy2/SuperAgent</text>
</svg>
